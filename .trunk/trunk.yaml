# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
    version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
    sources:
        - id: trunk
          ref: v1.10.2
          uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
    enabled:
        - go@1.21.0
        - node@22.16.0
        - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
    enabled:
        - black@26.5.1
        - semgrep@1.169.0
        - grype@0.115.0
        - isort@8.0.1
        - shellcheck@0.11.0
        - shfmt@3.6.0
        - svgo@4.0.1
        - taplo@0.10.0
        - bandit@1.9.4
        - checkov@3.2.500
        - dotenv-linter@4.0.0

        - eslint@10.6.0
        - git-diff-check
        - hadolint@2.14.0
        - markdownlint@0.49.0
        - osv-scanner@2.4.0
        - oxipng@10.1.1
        - prettier@3.9.3
        - ruff@0.15.0
        - trufflehog@3.95.7
        - yamllint@1.38.0
        - vale
        - mypy-custom
        - biome
    definitions:
        - name: mypy-custom
          files: [python]
          commands:
              - name: lint
                # Use absolute path so Trunk's sandboxed env can locate mypy
                run:
                    C:/DevEnvironments/master_env/Scripts/mypy.exe --config-file axion-core/standards/mypy.ini ${target}
                read_output_from: stdout
                output: pass_fail
                success_codes: [0, 1]
    ignore:
        - linters: [ALL]
          paths:
              - "**/.venv/**" # Ignore virtual environment files
              - "**/vendor/**" # Ignore third-party dependencies
              - "**/.gemini/**" # Ignore Gemini files
              - "**/.ruff_cache/**" # Ignore ruff cache files
              - "**/node_modules/**" # Ignore Node.js dependencies
              - "**/.agent/**" # Ignore AI Agent workspaces
              - "**/dist/**" # Ignore distribution files
              - "**/.git/**" # Ignore Git files
              - "**/.github/**" # Ignore GitHub configuration files
              - "**/.vscode/**" # Ignore VSCode configuration files
        - linters: [prettier]
          paths:
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.js"
              - "**/*.jsx"
              - "**/*.json"
              - "**/*.jsonc"
              # Biome handles TS/JS/JSON; Prettier is only for HTML, CSS, YAML, Markdown
        - linters: [biome]
          paths:
              - "**/*.md"
              - "**/*.yaml"
              - "**/*.yml"
              - "**/*.css"
              - "**/*.html"
              # Biome is scoped to TS/JS/JSON; these are handled by their own linters
        - linters: [ruff]
          paths:
              - "open_notebook/api/routers/chat.py" # Temporary ignore while refactoring
actions:
    disabled:
        - trunk-announce
        - trunk-check-pre-push
        - trunk-fmt-pre-commit
        - trunk-check-pre-commit
    enabled:
        - trunk-upgrade-available
